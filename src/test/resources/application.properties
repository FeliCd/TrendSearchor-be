# Test configuration – dùng H2 in-memory thay cho MySQL thật
# Tránh lỗi "cannot connect to ${MYSQL_URL}" khi chạy mvn test

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Tắt import file .env (không cần khi test)
spring.config.import=

# JWT test values
app.jwt-secret=daf66e01593f61a15b857cf433aae03a005812b31234e149036bcc8dee755dbb
app.jwt-expiration-milliseconds=604800000

# Cloudinary test values
app.cloudinary.cloud-name=test-cloud
app.cloudinary.api-key=test-key
app.cloudinary.api-secret=test-secret

# OpenRouter test values
app.openrouter.api-key=test-key
app.openrouter.base-url=https://openrouter.ai/api/v1
app.openrouter.model=test-model

