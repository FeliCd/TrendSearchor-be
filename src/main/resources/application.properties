spring.application.name=TrendSearchor

# Spring config import để tự động load file .env
spring.config.import=optional:file:.env[.properties]

# ─── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ─── Security ───────────────────────────────────────────────────────────────────
# JWT secret – BẮT BUỘC set qua environment variable, KHÔNG có default
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration-milliseconds=86400000

# ─── Profile ───────────────────────────────────────────────────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── Semantic Scholar API ─────────────────────────────────────────────────────
app.semantic-scholar.api-key=${SEMANTIC_SCHOLAR_API_KEY:}
app.semantic-scholar.base-url=https://api.semanticscholar.org/graph/v1
app.semantic-scholar.rate-limit-per-second=1
app.semantic-scholar.rate-limit-per-day=1000
app.semantic-scholar.retry-max-attempts=3
app.semantic-scholar.retry-initial-delay-ms=1000
app.semantic-scholar.retry-max-delay-ms=30000
app.semantic-scholar.cache-ttl-minutes=15

# ─── OpenAlex API ───────────────────────────────────────────────────────────
app.openalex.mailto=phucntse183277@fpt.edu.vn
app.openalex.rate-limit-per-second=10
app.openalex.rate-limit-per-day=100000
app.openalex.retry-max-attempts=3
app.openalex.retry-initial-delay-ms=500
app.openalex.retry-max-delay-ms=30000
app.openalex.cache-ttl-minutes=15

# ─── Cloudinary ───────────────────────────────────────────────────────────
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ─── File Upload (Multipart) ──────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ─── OpenRouter API ───────────────────────────────────────────────────────────
app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.base-url=https://openrouter.ai/api/v1
app.openrouter.model=${OPENROUTER_MODEL:google/gemini-2.5-pro}

# ─── AI rate limiting (per user/IP, fixed 1-minute window) ─────────────────────
app.ai.rate-limit.max-per-minute=${AI_RATE_LIMIT_PER_MINUTE:20}

# ─── Search: giới hạn lĩnh vực Công nghệ ───────────────────────────────────────
# OpenAlex field IDs coi là "Công nghệ": 17=Computer Science, 22=Engineering,
# 26=Mathematics, 25=Materials Science, 18=Decision Sciences. Để rỗng = không lọc.
app.search.tech-field-ids=${TECH_FIELD_IDS:17,22,26,25,18}

# ─── Legal / Terms of Service ──────────────────────────────────────────────────
# Bump this whenever the Upload Agreement text changes; it is stamped onto every
# uploaded paper as evidence of which terms version the uploader accepted.
app.legal.terms-version=${LEGAL_TERMS_VERSION:1.0}

