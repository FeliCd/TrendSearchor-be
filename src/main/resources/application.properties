spring.application.name=TrendSearchor

# Spring config import để tự động load file .env
spring.config.import=optional:file:.env[.properties]

# ─── Database ───────────────────────────────────────────────────────────────────
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-missing-migrations=true

# ─── Security ───────────────────────────────────────────────────────────────────
# JWT secret – BẮT BUỘC set qua environment variable, KHÔNG có default
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration-milliseconds=86400000

# ─── Profile ───────────────────────────────────────────────────────────────────
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ─── App ───────────────────────────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:https://trendsearchor-be-production.up.railway.app}
