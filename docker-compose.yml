version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swp_backend
    ports:
      - "8080:8080"
    environment:
      # Nếu bạn muốn chạy local mà vẫn kết nối lên Railway MySQL, hãy điền thông tin vào đây:
      - MYSQL_URL=${MYSQL_URL}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: unless-stopped
